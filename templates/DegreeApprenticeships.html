<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Degree Apprenticeship Tracker</title>
    <style>
        .delete-btn {
            background: transparent;
            border: none;
            font-size: 1.05rem;
            cursor: pointer;
            padding: 5px;
            transition: transform 0.2s ease;
        }
        .delete-btn:hover {
            transform: scale(1.15);
        }

    </style>
</head>
<body style="background-color: #030712; color: #f9fafb; font-family: 'Inter', -apple-system, sans-serif; margin: 0; padding: 0;">
     <!-- creates the top navigation bar on the page -->
    <nav style="border-bottom: 1px solid #1f2937; background: rgba(3, 7, 18, 0.8); backdrop-filter: blur(8px); position: sticky; top: 0; z-index: 10; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center;">
        <div style="font-weight: 700; font-size: 1rem; color: #ffffff; display: flex; align-items: center; gap: 8px;">
            <span style="background: #2563eb; color: white; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem;">v1.0</span>
            DegreeApprenticeshipTracker   <!-- LOGO top left -->
    </nav>
            <!-- title -->
    <div style="max-width: 800px; margin: 40px auto; padding: 0 20px;">
        <div style="margin-bottom: 32px;">
            <h1 style="font-size: 1.75rem; font-weight: 700; color: #ffffff; margin: 0 0 8px 0; letter-spacing: -0.025em;">
                Current Degree Apprenticeships
            </h1>
        </div>
        <p style = "font-size: 1rem; color: #60a5fa; font-weight: 600; margin-top: 8px;">
            Degree Apprenticeships applied to: <span id = "tally-counter">{{total_applied}}</span>
        </p>
        <ul id="job-list" style="padding-left: 0; list-style-type: none; margin: 0; display: flex; flex-direction: column; gap: 12px;">
            {% for job in jobs %}

            <li class="job-item" style="background: #111827; border: 1px solid #1f2937; padding: 24px; border-radius: 16px; display: flex; gap: 24px; align-items: center; transition: all 0.5s ease;">
                <button class="delete-btn" onclick="hideJob('{{ job[0] }}', this)">❌</button>
                    <div style="display: flex; flex-direction: column; gap: 8px; flex: 1;">
                        <div>
                            <span style="background: #1e3a8a; color: #93c5fd; font-size: 0.75rem; font-weight: 600; padding: 4px 10px; border-radius: 6px; text-transform: uppercase; letter-spacing: 0.05em;">
                                {{ job[3] }}
                            </span>
                        </div>
                        <span class="job-title" style="font-size: 1rem; color: #f3f4f6; font-weight: 600; line-height: 1.4; {% if job[4] == 1 %} opacity: 0.5;{% endif %}">
                            {{ job[1] }}
                        </span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 16px;">
                            <input type = "checkbox"
                                   class="job-checkbox"
                                   {% if job[4] == 1 %}checked{% endif %}
                                   onchange="updateDatabase({{ job[0] }}, this)"
                                   style="accent-color: #2563eb; width: 22px; height: 22px; cursor: pointer;">
                        <a href="{{ job[2] }}" target="_blank" class="apply-btn" style="background-color: {% if job[4] == 1 %}#374151{% else %}#2563eb{% endif %}; color: white; padding: 10px 20px; box-sizing: border-box; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 0.85rem; white-space: nowrap; min-width: 125px; text-align: center; display: inline-block; transition: background 0.2s;">
                            {% if job[4] == 1 %}Applied{% else %}Apply Here{% endif %}
                        </a>
                    </div>

                </li>
            {% endfor %}
        </ul>

    </div>

</body>
</html>

<script>
    function updateDatabase(jobId,checkbox) {
        fetch('/toggle/' + jobId, {
            method: 'POST'
        }).then(response => {
            if (response.ok) {
                const listItem = checkbox.closest('.job-item');
                const titleSpan = listItem.querySelector('.job-title');
                const applyBtn = listItem.querySelector('.apply-btn');
                const ulList = document.getElementById('job-list');
                const tallySpan = document.getElementById('tally-counter');
                let currentTally = parseInt(tallySpan.textContent);

                setTimeout(() => {
                    if (checkbox.checked) {
                        titleSpan.style.opacity = '0.5';
                        applyBtn.style.backgroundColor = '#374151';
                        applyBtn.textContent = 'Applied';
                        ulList.appendChild(listItem);
                        tallySpan.textContent = currentTally + 1;
                    } else {
                        titleSpan.style.opacity = '1';
                        applyBtn.style.backgroundColor = '#2563eb';
                        applyBtn.textContent = 'Apply Here';
                        ulList.insertBefore(listItem, ulList.firstChild);
                        tallySpan.textContent = currentTally - 1;
        }
                setTimeout(() => {
                    listItem.style.opacity = '1';
                    listItem.style.transform = 'scale(1)';
        }, 50);

    }, 300);
            } else {
                alert("Failed to update database.");
            }
        });
    }
    function hideJob(jobId, button) {
        if (confirm("Are you sure you want to remove this job?")){
            fetch('/hide/' + jobId,{
                method: 'POST'
            }).then(response => {
                if (response.ok){
                    const listItem = button.closest('.job-item')
                    const checkbox = listItem.querySelector('.job-checkbox')
                    if (checkbox && checkbox.checked) {
                        const tallySpan = document.getElementById('tally-counter');
                        let currentTally = parseInt(tallySpan.textContent);
                        tallySpan.textContent = currentTally -1;
                    }
                    listItem.remove();
                } else {
                    alert("We couldn't remove the job");
                }
            });
        }
    }
</script>
